name: Sync dari android_kernel_common

on:
  workflow_dispatch:
    inputs:
      src_branch:
        description: "Branch di repo sumber"
        default: "6.12"
      dst_branch:
        description: "Branch tujuan di repo ini"
        default: "6.12"

permissions:
  contents: write

env:
  SRC_REPO: https://github.com/usermahiro/android_kernel_common.git

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo ini
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch sumber lalu reset ke HEAD-nya
        run: |
          git remote add upstream "$SRC_REPO"
          git fetch upstream "${{ inputs.src_branch }}"
          git reset --hard FETCH_HEAD

      - name: Force push
        run: |
          git push -f origin "HEAD:refs/heads/${{ inputs.dst_branch }}"
