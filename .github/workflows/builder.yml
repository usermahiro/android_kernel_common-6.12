name: Sync dari android_kernel_common

on:
  workflow_dispatch:
    inputs:
      src_branch:
        description: "Branch di repo sumber"
        default: "6.12"
      dst_branch:
        description: "Branch tujuan di repo ini"
        default: "6.12"

env:
  SRC_REPO: https://github.com/usermahiro/android_kernel_common.git

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Clone sumber (branch ${{ inputs.src_branch }})
        run: |
          git clone --branch "${{ inputs.src_branch }}" --single-branch "$SRC_REPO" src

      - name: Force push ke repo ini
        run: |
          cd src
          git push --f
